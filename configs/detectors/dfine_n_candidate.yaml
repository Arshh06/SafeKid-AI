# SafeKid AI Detector Configuration - D-FINE-N Proposed Primary Candidate
detector:
  backend: dfine
  model_variant: dfine_n
  model_name_or_path: models/dfine_n_coco.pth
  config_path: dfine_repo/configs/dfine/dfine_hgnetv2_n_coco.yml
  architecture_type: Transformer (Fine-grained Distribution Refinement DETR)
  backbone: HGNetv2 (Nano)
  head: FDR Transformer Decoder with multi-scale weighting
  confidence_threshold: 0.35
  iou_threshold: 0.45
  imgsz: 640
  device: cpu
  person_class_id: 0
  num_threads: 4

tracker:
  tracker_type: bytetrack
  tracker_config_path: configs/trackers/bytetrack_surveillance.yaml
  persist: true
  imgsz: 640
  confidence_threshold: 0.35
  track_high_thresh: 0.30
  track_low_thresh: 0.10
  new_track_thresh: 0.35
  track_buffer: 60
  match_thresh: 0.75

evaluation:
  target_hardware: CPU (Intel Core i3-1215U / 6 cores)
  input_resolution: [640, 640]
  fair_comparison: true

