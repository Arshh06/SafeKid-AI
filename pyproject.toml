[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safekid-ai"
version = "0.1.0"
description = "AI-powered child safety monitoring system specifically for gated residential communities"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary / Internal Residential Community Safety License" }
authors = [
    { name = "SafeKid AI Engineering Team" }
]
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "opencv-python>=4.8.0.76",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "ultralytics>=8.1.0",
    "lapx>=0.5.5",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "faster-coco-eval>=1.6.6",
    "calflops>=0.1.2",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "timm>=0.9.12",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

